services:
  prefect-worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_TOKEN: ${GIT_TOKEN:-${GITHUB_TOKEN}}
    container_name: prefect-worker
    restart: always
    env_file:
      - .env
    environment:
      - PREFECT_API_URL=${PREFECT_API_URL}
      - PREFECT_API_KEY=${PREFECT_API_KEY}
    volumes:
      - .:/app
