# Welcome to your prefect.yaml file! You can use this file for managing your project and deployments.
# Generic metadata about this project
name: lnb-basket
prefect-version: 3.0.0
# build section allows you to manage and coordinate how your deployment code is packaged
build: null
# push section allows you to manage and coordinate how your deployment code is uploaded
push: null
# pull section allows you to manage and coordinate how your deployment code is retrieved
pull:
- prefect.deployments.steps.git_clone:
    id: clone_step
    repository: https://github.com/martindieser/lnb-basket.git
    branch: main
    access_token: "{{ prefect.blocks.secret.github-token }}"

# deployment section allows you to manage and coordinate your deployments
deployments:
- name: cabb-ingestion
  version: null
  tags: ["bronze"]
  description: "Scraping de datos crudos de la CABB (Capa Bronze)"
  schedule:
    cron: "0 4 * * *"
    timezone: "UTC"
  entrypoint: "src/flows/ingestion.py:ingestion_flow"
  parameters: {}
  work_pool: &work_pool_config
    name: default-managed
    work_queue_name: null
    job_variables:
      image: "ghcr.io/martindieser/lnb-basket:latest"
      env:
        S3_BUCKET_NAME: "{{ prefect.blocks.secret.s3-bucket-name }}"
        AWS_ACCESS_KEY_ID: "{{ prefect.blocks.secret.aws-access-key-id }}"
        AWS_SECRET_ACCESS_KEY: "{{ prefect.blocks.secret.aws-secret-access-key }}"
        AWS_REGION: "{{ prefect.blocks.secret.aws-region }}"
        S3_RAW_PREFIX: "{{ prefect.blocks.secret.s3-raw-prefix }}"
        S3_CURATED_PREFIX: "{{ prefect.blocks.secret.s3-curated-prefix }}"
        S3_ANALYTICS_PREFIX: "{{ prefect.blocks.secret.s3-analytics-prefix }}"

- name: cabb-normalization
  version: null
  tags: ["silver"]
  description: "Normalización de datos de la CABB (Capa Silver)"
  entrypoint: "src/flows/normalization.py:normalization_flow"
  parameters: {}
  work_pool: *work_pool_config
  triggers:
    - type: event
      enabled: true
      match:
        prefect.resource.id: "prefect.flow-run.*"
      match_related:
        - prefect.resource.name: "cabb_ingestion_bronze"
          prefect.resource.role: "flow"
      expect:
        - "prefect.flow-run.Completed"

- name: cabb-analytics
  version: null
  tags: ["gold"]
  description: "Procesamiento de datos de la CABB para Analiticas (Capa Gold)"
  entrypoint: "src/flows/analytics.py:analytics_flow"
  parameters: {}
  work_pool: *work_pool_config
  triggers:
    - type: event
      enabled: true
      match:
        prefect.resource.id: "prefect.flow-run.*"
      match_related:
        - prefect.resource.name: "cabb_normalization_silver"
          prefect.resource.role: "flow"
      expect:
        - "prefect.flow-run.Completed"
